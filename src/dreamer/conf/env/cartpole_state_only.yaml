# @package _global_
# CartPole state-only configuration
# No pixels, small model for fast iteration

general:
  use_pixels: false

environment:
  environment_name: CartPole-v1
  n_actions: 2
  n_observations: 4

models:
  d_hidden: 64
  architecture_contract: reference_v3_state
  rnn:
    n_blocks: 8

train:
  batch_size: 32
  max_train_steps: 30000
